    <script>
      // Gracefully prevent unhandled WebSocket/HMR disconnect errors from bubbling in preview iframe
      window.addEventListener('error', function(e) {
        if (e && (e.filename?.includes('@vite/client') || e.message?.includes('WebSocket') || e.message?.includes('vite'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && e.reason ? String(e.reason.message || e.reason) : '';
        if (reason.includes('WebSocket') || reason.includes('@vite/client')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
